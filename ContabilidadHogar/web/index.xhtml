<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<head>
    <title>TODO supply a title</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background-color: #007A74;
        }
        .form-container {
            margin-top: 20px;
        }
        #anyo{
            background-color: white;
            border:1px solid black;
        }
    </style>
</head>
<body>
      <!--Mostramos las distintas páginas a las que podemos dirigirnos-->
    <h:form>
        <h:panelGrid columns="1">
            <h:column>
                <div style="border:1px solid red; margin-right: 5px">
                    <h:commandLink value="Tipos De Movimientos" action="tiposDeMovimientos" style="text-decoration: none"></h:commandLink>
                </div>
            </h:column>
        </h:panelGrid>
    </h:form>
  <!--Seleccionamos los valores de lo que vamos a registrar-->
    <div class="form-container">
        <h:form>
            <table border="1">
                <span id="anyo">
                    <h:outputLabel value="#{RegistrarFechaMovimiento.anyo}"></h:outputLabel>
                </span>
                
                <h:selectOneMenu value="#{RegistrarFechaMovimiento.mes}">
                    <f:selectItems value="#{RegistrarFechaMovimiento.listaMeses}"></f:selectItems>
                </h:selectOneMenu>
                
                <h:selectOneMenu value="#{RegistrarFechaMovimiento.tipoDeMovimiento}">
                    <f:selectItems value="#{ManagedBeanMovimiento.listaDeMovimientos}"></f:selectItems>
                </h:selectOneMenu>
                
                <span id="cantidad">
                    <h:inputText value="#{RegistrarFechaMovimiento.importe}"></h:inputText>
                </span>
                
                <h:commandButton value="Registrar" action="#{RegistrarFechaMovimiento.registrarFechaMovimiento()}"></h:commandButton>
                <h:commandButton value="Limpiar importe" action="#{RegistrarFechaMovimiento.clear()}"></h:commandButton><!--Limpiar el cuadro de texto-->
            </table>
            <h:messages style="color: red;border: 1px solid red;background-color: yellow" ></h:messages><!--Para mostrar un mensaje de error, en caso de valor no válido-->
        </h:form>
    </div>
    
        <!--Mostramos todos los datos que tenemos registrados-->
        <h:form>
            <h:dataTable value="#{RegistrarFechaMovimiento.listaFechaDeMovimientos}" var="movimiento">
                <h:column>
                    <h:outputLabel value="#{movimiento}"></h:outputLabel>                    
                </h:column>


            </h:dataTable>
        </h:form>
</body>
</html>
